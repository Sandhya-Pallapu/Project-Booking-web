<!DOCTYPE html>
<html >
<head>
    <title>Password generator</title>
    <link rel="stylesheet" href="password.css">
</head>
<body>
<div class="main">
    <h1>Password Generator</h1>
    <form>
        <label for="number" id="special">Enter the length:</label>
        <input type="number" id="length" min="8" max="32"><br>
        <br>
        <input type="checkbox" id="uppercase">
        <label for="uppercase"> Uppercase</label>
         <br><br>
        <input type="checkbox" id="lowercase">
        <label for="lowercase">lowercase</label>
         <br><br>
      <input type="checkbox" id="numbers">
       <label for="numbers">Numbers</label><br>
         <br>
        
       <input type="checkbox" id="symbols">
         <label for="symbols"> Symbols</label><br><br>
        <button type="button" onclick="change()">Submit</button>
    </form>
    <h3 id="password">Password:</h3>
</div>    
<script src="script.js"></script>
</body>
</html>
